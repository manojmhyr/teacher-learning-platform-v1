<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!--CSP-->
    <title>Teacher Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #F4F6F5; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111816; } }
      :root[data-theme="dark"] { --bg: #111816; }
      html, body, #root { height: 100%; }
      body { margin: 0; background: var(--bg); }
      #boot { font: 500 15px/1.5 system-ui, sans-serif; color: #2E5E4E; padding: 48px 24px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Loading Teacher Portal…</div></div>
    <noscript><div style="padding:24px;font:15px system-ui,sans-serif;text-align:center">JavaScript is required to use the Teacher Portal.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
